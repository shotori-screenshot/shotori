tray:
  tooltip:
    en: Shotori — click to take a screenshot
    zh-CN: Shotori — 点击截图
  screenshot:
    en: Screenshot
    zh-CN: 截图
  settings:
    en: Settings…
    zh-CN: 设置…
  quit:
    en: Quit
    zh-CN: 退出
notify:
  copied:
    title:
      en: Screenshot copied
      zh-CN: 截图已复制
    body:
      en: The image is ready to paste.
      zh-CN: 图片已就绪，可以直接粘贴。
  saved:
    title:
      en: Screenshot saved
      zh-CN: 截图已保存
  open_failed:
    title:
      en: Couldn’t open image
      zh-CN: 无法打开图片
    body:
      en: Open the saved file from your file manager.
      zh-CN: 请在文件管理器中打开已保存的文件。
  view_image:
    en: View image
    zh-CN: 查看图片
  open_text:
    en: Open text
    zh-CN: 打开文本
  scroll:
    start_failed:
      title:
        en: Can’t start a long screenshot
        zh-CN: 无法开始长截图
      cross_screen:
        en: The selection must sit fully inside a single screen.
        zh-CN: 选区必须完整位于同一块屏幕内。
      no_bar:
        en: The control bar failed to open.
        zh-CN: 控制条打开失败。
  pin:
    failed:
      title:
        en: Couldn’t pin image
        zh-CN: 无法贴图
      body:
        en: Try pinning the selection again.
        zh-CN: 请重试贴图。
  copy:
    failed:
      title:
        en: Couldn’t copy screenshot
        zh-CN: 无法复制截图
      body:
        en: Try again, or save the image to a file.
        zh-CN: 请重试，或将图片保存为文件。
  ocr:
    empty:
      title:
        en: No text found
        zh-CN: 未识别到文字
      body:
        en: Try selecting a clearer area containing text.
        zh-CN: 请尝试选择更清晰的文字区域。
    copied:
      title:
        en: Text copied
        zh-CN: 文字已复制
    copy_failed:
      title:
        en: Couldn’t copy text
        zh-CN: 无法复制文字
      body:
        en: The clipboard is unavailable. Try again.
        zh-CN: 剪贴板不可用，请重试。
    open_failed:
      title:
        en: Couldn’t open text
        zh-CN: 无法打开文本
      body:
        en: The recognized text is still on your clipboard.
        zh-CN: 识别结果仍在剪贴板中。
    failed:
      title:
        en: Couldn’t recognize text
        zh-CN: 无法识别文字
      body:
        en: "%{reason} Try again or select a clearer area."
        zh-CN: "%{reason} 请重试，或选择更清晰的区域。"

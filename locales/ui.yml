# Shotori UI strings. Embedded at compile time by rust-i18n (the same
# engine gpui-component uses); `fallback = "en"` in src/i18n.rs makes a
# missing translation degrade to English. Keys are grouped by module.
_version: 2
save:
  dialog_title:
    en: Save screenshot
    zh-CN: 保存截图
  png_filter:
    en: PNG image
    zh-CN: PNG 图片
  failed:
    title:
      en: Couldn’t save screenshot
      zh-CN: 无法保存截图
    body:
      en: Check the destination folder and available disk space.
      zh-CN: 请检查目标文件夹和磁盘剩余空间。
common:
  copy:
    en: Copy
    zh-CN: 复制
  save:
    en: Save
    zh-CN: 保存
  close:
    en: Close
    zh-CN: 关闭
settings:
  title:
    en: Shotori Settings
    zh-CN: Shotori 设置
  no_config_dir:
    en: "no config directory (is HOME set?)"
    zh-CN: "找不到配置目录（HOME 未设置？）"
  nav:
    expand:
      en: Expand navigation
      zh-CN: 展开导航
    collapse:
      en: Collapse navigation
      zh-CN: 折叠导航
  general:
    title:
      en: General
      zh-CN: 通用
    blurb:
      en: About this installation; the buttons below open its config files for editing.
      zh-CN: 关于本安装；下方按钮可打开配置文件进行编辑。
    config_files:
      en: Config files
      zh-CN: 配置文件
    open_failed:
      title:
        en: Couldn't open the config file
        zh-CN: 无法打开配置文件
      body:
        en: "xdg-open: %{error}"
        zh-CN: "xdg-open：%{error}"
    write_through:
      en: Edits anywhere in this window write straight through to the config files — the next screenshot picks them up.
      zh-CN: 本窗口中的任何修改都会立即写入配置文件——下次截图即生效。
    language:
      label:
        en: Language
        zh-CN: 语言
      system:
        en: System language
        zh-CN: 跟随系统语言
      blurb:
        en: Applies immediately, everywhere in this window.
        zh-CN: 立即生效，本窗口内即时切换。
  about:
    nav:
      en: About
      zh-CN: 关于
    tagline:
      en: Wayland-native screenshot tool — select, annotate, pin, long-capture scrolling pages, and read the text back with on-device OCR.
      zh-CN: Wayland 原生截图工具——框选、标注、贴图、长截图，并通过本地 OCR 识别文字。
    repository:
      en: Source repository
      zh-CN: 源码仓库
    issues:
      en: Report an issue
      zh-CN: 问题反馈
    license:
      en: Released under the MIT License.
      zh-CN: 以 MIT 许可证发布。
    credits:
      en: UI hand-drawn with gpui-kit · OCR by RapidOCR (PP-OCR) · Community themes — Catppuccin, Dracula, Gruvbox, Nord, Rosé Pine, Tokyo Night
      zh-CN: 界面基于 gpui-kit 手绘 · 识别引擎 RapidOCR（PP-OCR）· 社区主题——Catppuccin、Dracula、Gruvbox、Nord、Rosé Pine、Tokyo Night
  toolbar_page:
    title:
      en: Toolbar
      zh-CN: 工具栏
    blurb:
      en: Arrange the selection toolbar. Changes apply the next time you take a screenshot.
      zh-CN: 调整选区工具栏。下次截图时生效。
    hint:
      en: "Drag a control to move it · release anywhere to drop it at the highlighted gap · drop it on the palette to remove it · click to remove / append · hidden controls keep their keyboard shortcuts"
      zh-CN: "拖动控件可移动 · 松开鼠标即放入高亮空位 · 拖回面板即移除 · 点击可删除 / 添加 · 隐藏的控件仍保留快捷键"
    reset:
      en: Reset to defaults
      zh-CN: 恢复默认
    palette_hint:
      en: Not on the toolbar — drag onto the bar, or click to append
      zh-CN: 未在工具栏上——拖到工具栏，或点击添加
    separator:
      en: Separator
      zh-CN: 分隔线
  ocr_page:
    title:
      en: OCR
      zh-CN: 文字识别
    model:
      en: Model set
      zh-CN: 模型集
    blurb:
      en: Trade recognition speed, accuracy and language coverage. Applies to the next screenshot.
      zh-CN: 在识别速度、精度与语言覆盖之间取舍。下次截图时生效。
    ready:
      en: Ready
      zh-CN: 已就绪
    downloads_first:
      en: Downloads on first OCR
      zh-CN: 首次识别时下载
    cache_hint:
      en: "Models cache in %{dir}. A newly selected model downloads the first time you OCR (with a confirmation dialog); files shared between models are reused."
      zh-CN: "模型缓存于 %{dir}。新选择的模型会在首次识别时下载（有确认对话框）；模型间共享的文件会复用。"
    upright:
      title:
        en: "Assume upright text (faster)"
        zh-CN: 假定文字正立（更快）
      body:
        en: Skip the orientation check — screenshot text is almost always upright. Saves one inference stage and one model download; rotated text (photo of a page) is then read garbled.
        zh-CN: 跳过方向检测——截图里的文字几乎总是正立的。省去一级推理和一个模型下载；旋转文字（如拍摄的书页）将无法正确识别。
  appearance:
    title:
      en: Appearance
      zh-CN: 外观
    blurb:
      en: Colors the next capture will use; every edit writes to the theme file.
      zh-CN: 调整截图将使用的配色；每次修改都会写入主题文件。
    base_palette:
      en: Base palette
      zh-CN: 基础配色
    dim_opacity:
      en: Dim opacity
      zh-CN: 遮罩不透明度
    reset_colors:
      en: Reset to base
      zh-CN: 重置为基础色
pin:
  menu:
    reset_zoom:
      en: Reset zoom
      zh-CN: 重置缩放
  notify:
    copy_failed:
      title:
        en: Couldn’t copy the pinned image
        zh-CN: 无法复制贴图
      body:
        en: Try again, or copy from the overlay instead.
        zh-CN: 请重试，或改在截图界面上复制。
scroll:
  notify:
    running:
      title:
        en: Long screenshot running
        zh-CN: 长截图进行中
      body:
        en: Scroll the content to capture. Enter or Ctrl+C copies, Ctrl+S saves, Esc cancels.
        zh-CN: 滚动页面以捕获内容。Enter 或 Ctrl+C 复制，Ctrl+S 保存，Esc 取消。
    stopped_early:
      title:
        en: Long screenshot stopped early
        zh-CN: 长截图提前中止
      partial:
        en: "%{reason}\nThe partial image was copied."
        zh-CN: "%{reason}\n已完成部分已复制。"
    failed:
      title:
        en: Long screenshot failed
        zh-CN: 长截图失败
    waiting:
      title:
        en: Long screenshot waiting
        zh-CN: 长截图等待中
      body:
        en: Scroll the content inside the selection to capture. Esc cancels.
        zh-CN: 在选区内滚动页面以捕获内容。Esc 取消。
    copy_failed:
      title:
        en: Couldn’t copy the long screenshot
        zh-CN: 无法复制长截图
      body:
        en: The clipboard refused the image.
        zh-CN: 剪贴板拒绝了图片。

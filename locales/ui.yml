      title:
        en: Couldn’t pin image
        zh-CN: 无法贴图
      body:
        en: Try pinning the selection again.
        zh-CN: 请重试贴图。
  copy:
    failed:
      title:
        en: Couldn’t copy screenshot
        zh-CN: 无法复制截图
      body:
        en: Try again, or save the image to a file.
        zh-CN: 请重试，或将图片保存为文件。
  ocr:
    empty:
      title:
        en: No text found
        zh-CN: 未识别到文字
      body:
        en: Try selecting a clearer area containing text.
        zh-CN: 请尝试选择更清晰的文字区域。
    copied:
      title:
        en: Text copied
        zh-CN: 文字已复制
    copy_failed:
      title:
        en: Couldn’t copy text
        zh-CN: 无法复制文字
      body:
        en: The clipboard is unavailable. Try again.
        zh-CN: 剪贴板不可用，请重试。
    failed:
      title:
        en: Couldn’t recognize text
        zh-CN: 无法识别文字
      body:
        en: Try again or select a clearer area.
        zh-CN: 请重试，或选择更清晰的区域。

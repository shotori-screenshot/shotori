    title:
      en: Screenshot copied
      zh-CN: 截图已复制
    body:
      en: The image is ready to paste.
      zh-CN: 图片已就绪，可以直接粘贴。
  saved:
    title:
      en: Screenshot saved
      zh-CN: 截图已保存
  open_failed:
    title:
      en: Couldn’t open image
      zh-CN: 无法打开图片
    body:
      en: Open the saved file from your file manager.
      zh-CN: 请在文件管理器中打开已保存的文件。
  view_image:
    en: View image
    zh-CN: 查看图片
  scroll:
    start_failed:
      title:
        en: Can’t start a long screenshot
        zh-CN: 无法开始长截图
      cross_screen:

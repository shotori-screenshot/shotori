<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="none"
  role="img"
  aria-label="mosaic"
>
  <!-- A borderless 3×3 checkerboard within Lucide's optical bounds.
       Empty cells stay transparent: GPUI tints SVG masks
       with the toolbar foreground, so painted white cells would become
       solid too. This preserves contrast on either theme and on hover. -->
  <path
    fill="currentColor"
    stroke="none"
    d="M5 3h4v6H3V5a2 2 0 0 1 2-2Z
       M15 3h4a2 2 0 0 1 2 2v4h-6Z
       M9 9h6v6H9Z
       M3 15h6v6H5a2 2 0 0 1-2-2Z
       M15 15h6v4a2 2 0 0 1-2 2h-4Z"
  />
</svg>

[workspace]
# `cargo build` / `cargo test` at the root still mean the root package
# only; the tools build via `cargo build --workspace` / `-p vptr`.
members = ["tools/vptr", "tools/scrollprobe"]

[features]
# Developer-only E2E perf harness (`shotori --perf`): not part of
# release builds; run with `cargo build --release --features perf`
perf = []

[package]
name = "shotori"
version = "0.13.0"
edition = "2024"
description = "Shotori — Wayland-first screenshot tool with optional OCR (gpui-kit)"
license = "MIT"
repository = "https://github.com/mengh04/shotori"
keywords = ["screenshot", "wayland", "gpui", "screencopy", "clipboard"]
categories = ["graphics", "multimedia::images", "command-line-utilities"]

[dependencies]
# default-features off: the default pulls the component library, whose
# Root/WindowState is poison for layer-shell overlays (AGENTS.md "the
# Root/CSD poisoning case"). We only use the base layer + assets.
gpui-kit = { version = "0.7", default-features = false, features = ["assets"] }
anyhow = "1.0"
png = "0.18"

# System tray (Linux StatusNotifierItem over zbus, macOS AppKit — one
# crate). The gpui-kit feature makes its types interoperate with our
# gpui-pre 0.3.x directly.
gpui-tray = { version = "0.1.4", default-features = false, features = [
    "gpui-kit",
    "menu-state",
] }

# In-memory pixels → gpui display (RenderImage is built from the image
# crate's Frames; must match gpui-pre's version, currently 0.25.10)
image = "0.25"
smallvec = "1"

# Embed assets/icons at build time (the self-maintained toolbar SVGs —
# same 8.x line gpui-kit-assets already compiles, zero extra cost)
rust-embed = "8"

# Sequence badge text: parse and rasterize a bundled font.
ab_glyph = "0.2.32"

# Multilingual text annotations use the same shaping stack as GPUI.
cosmic-text = "0.19.0"

# Human-readable timestamp for save filenames (chrono is already in the
# gpui dep tree — zero extra compile)
chrono = "0.4"

# Native "save as" dialog: GTK-free xdg-portal on Linux
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Scratch files (OCR model download staging; wayland shm)
tempfile = "3"

# window-snap backends: sway (i3 GET_TREE) and Hyprland (j/clients) speak
# JSON over their unix sockets; parsed with serde_json Values (their
# schemas drift across versions, tolerant field-by-field beats typed)
serde_json = "1"
toml = "1"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }

# ── Linux (Wayland): screencopy capture, wlr-data-control clipboard,
#    D-Bus notifications, compositor IPC for window snapping ──────────
[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2"
wayland-client = "0.31"
# Bounded poll() on the wayland socket in the capture wait loop; already
# in the tree via wayland-backend, so this adds no extra compilation
rustix = { version = "1.1", features = ["event"] }
wayland-protocols-wlr = "0.3"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
memmap2 = "0.9"
niri-ipc = "26.4.0"
notify-rust = "4"

[dependencies.rapidocr-core]
version = "0.2"
default-features = false
features = ["model-download"]

# First-run model download with progress + cancel (same reqwest version as
# rapidocr-core's, features unify)
[dependencies.reqwest]
version = "0.12"
features = ["blocking", "rustls-tls"]
default-features = false

# Post-download integrity check (expected hashes ship in the model spec)
[dependencies.sha2]
version = "0.11"

[dev-dependencies]
# default-features off here too: feature unification with the main
# dependency would resurrect component otherwise
gpui-kit = { version = "0.7", default-features = false, features = ["test-support"] }

# The pin (floating image) feature lives on the `pin` branch (it needs the
# vendored set_layer_margin patch); once upstream merges it, the branch can
# return to main without a [patch.crates-io] section

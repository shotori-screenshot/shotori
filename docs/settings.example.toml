# Shotori settings — copy to ~/.config/shotori/settings.toml
#
# Managed by the settings window (`shotori settings`, or the tray
# menu). Hand edits are fine too; unknown keys and sections are
# preserved by the editor, comments are not. Changes apply the next
# time you take a screenshot.

[toolbar]
# Row one of the selection toolbar, left to right. Buttons not listed
# are hidden (their keyboard shortcuts keep working). "separator" is
# the thin vertical group break; any number may appear.
#
# Known button ids (factory order):
#   select, rectangle, ellipse, line, polyline, arrow, number,
#   pencil, highlighter, mosaic, eraser, text, clear,
#   ocr, pin, scroll, save, copy, settings, cancel
#
# The value below is the factory layout.
items = [
  "select", "rectangle", "ellipse", "line", "polyline", "arrow",
  "number", "pencil", "highlighter", "mosaic", "eraser", "text",
  "clear", "separator", "ocr", "pin", "scroll", "save", "copy",
  "separator", "settings", "cancel",
]

[ocr]
# Which bundled model set OCR uses. Missing models download on first
# use into the cache directory (Settings → OCR → Cache → Open shows
# it: $XDG_DATA_HOME/shotori/ocr-models, usually
# ~/.local/share/shotori/ocr-models).
#
# Known ids: ppocrv6-tiny, ppocrv6-small (default), ppocrv6-medium,
#   ppocrv5-en-mobile, ppocrv5-ch-mobile, ppocrv5-ch-server
model = "ppocrv6-small"

# Skip the orientation classifier — faster, for upright text only.
# Also applies to custom configs (it can only turn the classifier OFF;
# it never re-enables one the config skipped).
assume_upright = false

# Advanced: point this at your own rapidocr config TOML to run your
# own ONNX models — it overrides `model` entirely (the settings
# window's dropdown disables while it is active). The OCR page can
# also pick or create this file for you (Choose file… / New from
# template…). Relative model paths inside the TOML resolve against
# the TOML's own directory; a leading ~ expands to your home
# directory. See docs/ocr-custom-model.md for a worked example.
# Delete the key (or leave it empty) to go back to the bundled models.
# custom_config = "~/models/my-ocr.toml"

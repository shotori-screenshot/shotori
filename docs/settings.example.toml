# Shotori settings — copy to ~/.config/shotori/settings.toml
#
# Managed by the settings window (`shotori settings`, or the tray
# menu). Hand edits are fine too; unknown keys and sections are
# preserved by the editor, comments are not. Changes apply the next
# time you take a screenshot.

# UI language: "auto" (follows system locale), "en", or "zh-CN".
language = "auto"

# Pixel-based smart region selection (hover highlight, click snap,
# wheel hierarchy). Window snapping via compositor IPC is configured
# separately under `[capture] window_snap`.
smart_region = true

# Automatically select a newly drawn annotation so it can be moved or
# restyled right away.
annotation_auto_select = true

# Remember whether the settings sidebar rail is collapsed.
sidebar_collapsed = false

[capture]
# Snap hover and click to compositor windows (niri, sway, Hyprland).
window_snap = true

# Full-screen alignment crosshairs while aiming or dragging a selection.
crosshair = false

# Selection dimension badge: "logical" (W × H), "physical" (W × H px),
# "bounds" (X, Y · W × H), or "hidden".
size_label = "logical"

# Precision magnifier loupe during corner and handle drags.
loupe = true
loupe_zoom = 3         # 2..=8
loupe_size = "medium"  # "small" | "medium" | "large"

# Keep the capture overlay open after copying or after a direct save.
keep_open_after_copy = false
keep_open_after_save = false

# Mouse shortcuts while selecting regions.
double_click_copy = false
right_click_cancel = false

# Skip non-essential chrome animations (loupe fade, OSD orbit, sidebar slide).
reduce_motion = false

[export]
# Default directory for saving screenshots (supports a leading `~`).
# Unset or blank uses `~/Pictures/Shotori`.
# save_dir = "~/Pictures/Shotori"

# Save directly to `save_dir` when clicking Save / pressing Ctrl+S,
# skipping the native file dialog (issue #42).
auto_save = false

# When the file dialog is used, start in the folder chosen on the
# previous dialog save instead of resetting to `save_dir`.
remember_last_dir = false

# Filename stem (without extension): chrono strftime tokens plus `{w}`
# and `{h}` for physical width and height.
filename_template = "Shotori_%Y-%m-%d_%H-%M-%S_%3f"

# Default file format for saved screenshots: "png" | "jpeg" | "webp".
# (Clipboard and stdout always use PNG.)
format = "png"

# PNG compression effort: "fast" | "balanced" | "best".
png_compression = "balanced"

# JPEG encoding quality (1..=100) when `format = "jpeg"`.
jpeg_quality = 90

# Also copy the screenshot to the clipboard whenever saving to disk.
copy_on_save = false

# Automatically save a backup file to `save_dir` whenever copying to the clipboard.
save_on_copy = false

# Also save copied images to a private temp file (`$XDG_RUNTIME_DIR/shotori/clipboard`)
# and offer `text/uri-list` alongside `image/png`, so X11/Xwayland apps that do not
# handle incremental (`INCR`) clipboard transfers can still paste large screenshots.
# Disabled by default so clipboard managers watching `text/*` are not polluted.
clipboard_file_uri = false

[annotation]
# Default text-box wrapping mode: "word" | "character" | "none".
text_wrap = "word"

# Automatically renumber remaining sequence badges when one is deleted.
renumber_on_delete = false

# Initial palette swatch index (0..=6) for strokes/shapes and highlighter.
default_color_index = 0
highlighter_color_index = 2

# Initial tool sizes and styles.
stroke_width = 3               # 1..=20
highlighter_width = 20         # 8..=60
highlighter_blend = "multiply" # "multiply" | "translucent"
mosaic_strength = 16           # 4..=48
eraser_size = 32               # 8..=96
text_size = 24                 # 12..=72
number_size = 32               # 16..=64
number_fill = true             # true (solid badge) | false (outline ring)
number_format = "decimal"      # "decimal" | "alphabetic" | "roman"
arrow_style = "open"           # "open" | "filled" | "triangle" | "outline" | "double_open" | "double_triangle" | "dimension"
smooth_pencil = true
spotlight_opacity = 55         # 0..=100
spotlight_ellipse = false
magnifier_zoom = 2             # 1..=8
magnifier_ellipse = false
magnifier_shadow = false
geometry_radius = 0            # 0..=48
geometry_fill = false
text_bold = false
text_outline = false

[toolbar]
# Row one of the selection toolbar, left to right. Buttons not listed
# are hidden (their keyboard shortcuts keep working). "separator" is
# the thin vertical group break; any number may appear.
#
# Known button ids (all 23):
#   select, rectangle, ellipse, line, polyline, arrow, number,
#   pencil, highlighter, mosaic, magnifier, spotlight, eraser, text,
#   clear, ocr, qr, pin, scroll, save, copy, settings, cancel
#
# Custom actions are referenced as "custom:<id>" (defined below under
# `[[custom_actions]]` or discovered from `~/.config/shotori/actions/`).
#
# The value below is the factory layout (`select` and `spotlight` live
# in the add-buttons palette by default).
items = [
  "rectangle", "ellipse", "line", "polyline", "arrow",
  "number", "pencil", "highlighter", "mosaic", "magnifier",
  "eraser", "text", "clear", "separator",
  "ocr", "qr", "pin", "scroll", "save", "copy", "separator",
  "settings", "cancel",
]

# The 7 opaque annotation palette swatches (#RRGGBB or #RRGGBBAA with FF alpha).
colors = [
  "#FF4545FF", "#FF8A32FF", "#FFD43BFF", "#40C878FF",
  "#409CFFFF", "#222222FF", "#FFFFFFFF",
]

[notify]
# Desktop notifications over org.freedesktop.Notifications.
enabled = true
on_copy = true
on_save = true
on_ocr = true
on_qr = true
show_thumbnail = true
timeout_secs = 10 # 2..=30

[pin]
# Modifier required to wheel-zoom a floating pin: "none" | "ctrl" | "alt" | "shift".
zoom_modifier = "none"
# Modifier required to adjust a floating pin's opacity by wheel:
# "ctrl" | "alt" | "shift" | "none" | "disabled".
opacity_modifier = "ctrl"
zoom_step = 12        # 5..=50 (% per wheel notch; 12 = 1.12x)
opacity = 100         # 20..=100 (% initial pin opacity)
double_click = "none" # "none" | "close" | "copy_close" | "reset_zoom" | "collapse"
show_border = true
shadow = true
snap_to_edge = false
snap_to_pins = true
max_history = 50      # 0..=200 (0 disables persistent pin history)

[scroll]
# Default growth direction for long screenshots: "vertical" | "horizontal".
default_axis = "vertical"

# Maximum stitched length in logical pixels (2000..=100000).
max_length = 20000

# Temporarily disable window transparency and background blur while a long
# screenshot is running so stationary wallpaper pixels do not disrupt
# stitching: "auto" (built-in Hyprland IPC, niri IPC, KDE KWin D-Bus),
# "custom" (run `enter_command` / `exit_command` below), or "off".
transparency_mode = "auto"

# Shell commands executed via `sh -c` when `transparency_mode = "custom"`.
# Both receive SHOTORI_SCROLL_OUTPUT and SHOTORI_SCROLL_{X,Y,W,H}.
# Examples:
#   SwayFX:   enter_command = "swaymsg blur disable"
#             exit_command  = "swaymsg blur enable"
#   Kitty:    enter_command = "kitty @ set-background-opacity 1"
#             exit_command  = "kitty @ set-background-opacity 0.85"
# enter_command = ""
# exit_command = ""

[ocr]
# Which bundled model set OCR uses. Missing models download on first
# use into the cache directory ($XDG_DATA_HOME/shotori/ocr-models,
# usually ~/.local/share/shotori/ocr-models).
#
# Known ids: ppocrv6-tiny, ppocrv6-small (default), ppocrv6-medium,
#   ppocrv5-en-mobile, ppocrv5-ch-mobile, ppocrv5-ch-server
model = "ppocrv6-small"

# Skip the orientation classifier — faster, for upright text only.
assume_upright = false

# Join recognized multi-line text with spaces instead of hard newlines.
join_lines = false

# Advanced: point this at your own rapidocr config TOML to run your
# own ONNX models — it overrides `model` entirely.
# custom_config = "~/models/my-ocr.toml"

[keys]
# Configurable overlay shortcuts (`escape` and `enter` stay reserved).
copy = "ctrl-c"
save = "ctrl-s"
pin = "ctrl-p"
ocr = "ctrl-o"
qr = "ctrl-q"
scroll = "ctrl-l"
select_screen = "ctrl-a"
settings = "ctrl-,"

tool_select = "v"
tool_rectangle = "r"
tool_ellipse = "e"
tool_line = "l"
tool_polyline = "p"
tool_arrow = "a"
tool_number = "n"
tool_pencil = "b"
tool_highlighter = "h"
tool_mosaic = "m"
tool_magnifier = "g"
tool_spotlight = "shift-h"
tool_eraser = "d"
tool_text = "t"
undo = "ctrl-z"
redo = "ctrl-y"
delete = "delete"
clear = "ctrl-shift-delete"

# ── Custom toolbar actions ────────────────────────────────────────────────────
# User-defined actions with custom SVG icons and shell commands. Actions can be
# listed inline here as `[[custom_actions]]` (editable in `shotori settings`)
# or dropped into `~/.config/shotori/actions/<name>.toml` (or
# `~/.config/shotori/actions/<dir>/action.toml` with a sibling `icon.svg`).
# Place an action on the toolbar by adding `"custom:<id>"` to `[toolbar] items`.
#
# Runtime environment variables injected into every command:
#   SHOTORI_ACTION_ID, SHOTORI_ACTION_NAME
#   SHOTORI_IMAGE_PATH (when input = "file"; temp file cleaned up after exit)
#   SHOTORI_TEXT_PATH  (when input = "ocr_text"; also piped to stdin)
#   SHOTORI_WIDTH, SHOTORI_HEIGHT (physical cropped pixels)
#   SHOTORI_X, SHOTORI_Y, SHOTORI_W, SHOTORI_H (desktop logical selection)
#   SHOTORI_OUTPUT, SHOTORI_FORMAT, SHOTORI_ANNOTATED ("1" | "0")
#
# Valid fields:
#   id            = "upload-r2"       # lowercase [a-z0-9_-], starts with a-z/0-9
#   name          = "Upload to R2"    # display label / tooltip / OSD status
#   icon          = "cloud-upload"    # built-in preset or .svg path (relative -> ~/.config/shotori/icons/)
#   command       = "..."             # executed via `/bin/sh -c`
#   working_dir   = ""                # optional working directory
#   input         = "file"            # "file" | "stdin" | "ocr_text" | "none"
#   source        = "annotated"       # "annotated" | "raw"
#   output        = "copy_text"       # "copy_text" | "copy_image" | "pin" | "notify" | "json" | "ignore"
#   close_overlay = true              # true: unmap overlay + show top OSD pill; false: stay open
#   timeout_secs  = 30                # 1..=300
#   shortcut      = "ctrl-u"          # optional overlay key chord
#
# Built-in icon presets:
#   sparkles, cloud-upload, upload, terminal, code, bot, globe, send, share-2,
#   link, webhook, zap, wand-sparkles, plug, rocket, wrench, image, folder,
#   external-link, play
#
# Example (uncomment to enable):
# [[custom_actions]]
# id = "upload-picgo"
# name = "Upload Image"
# icon = "cloud-upload"
# command = 'picgo upload "$SHOTORI_IMAGE_PATH" | tail -n 1'
# input = "file"
# source = "annotated"
# output = "copy_text"
# close_overlay = true
# timeout_secs = 30
# shortcut = "ctrl-u"

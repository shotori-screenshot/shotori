name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package (strip + tarball)
        run: |
          strip target/release/shotori
          mkdir dist
          cp target/release/shotori LICENSE dist/
          mkdir -p dist/assets dist/scripts
          cp -r assets/app dist/assets/
          cp assets/shotori.desktop dist/assets/
          cp scripts/install-desktop.sh scripts/generate-icons.py dist/scripts/
          tar -C dist -czf "shotori-${GITHUB_REF_NAME}-x86_64.tar.gz" shotori LICENSE assets scripts

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball-linux
          path: shotori-*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-tarball-linux

      - name: Create release with artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACTS=$(ls shotori-*.tar.gz)
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "${GITHUB_REF_NAME}" $ARTIFACTS \
              --title "shotori ${GITHUB_REF_NAME}" --notes-file "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" $ARTIFACTS \
              --title "shotori ${GITHUB_REF_NAME}" --generate-notes
          fi

  aur:
    # Bump the AUR package (pkgver + sha256) and push via the release key.
    # Requires the AUR_SSH_KEY secret (private key registered on AUR).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-tarball-linux
          path: artifact

      - name: Push PKGBUILD update to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm git openssh >/dev/null
          install -dm700 /root/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          # Point ssh AT the key (locally ~/.ssh/config does this; the
          # container has neither default keys nor a config — without it
          # auth falls through to "publickey denied")
          cat > /root/.ssh/config <<'EOF'
          Host aur.archlinux.org
              User aur
              IdentityFile /root/.ssh/aur
              IdentitiesOnly yes
          EOF
          ssh-keyscan -t ed25519 aur.archlinux.org >> /root/.ssh/known_hosts
          git config --global user.name "shotori-release-bot"
          git config --global user.email "mengh04@users.noreply.github.com"
          git clone ssh://aur@aur.archlinux.org/shotori.git aur
          cd aur
          SHA=$(sha256sum "../artifact/shotori-${GITHUB_REF_NAME}-x86_64.tar.gz" | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" PKGBUILD
          # Preserve the existing binary/license packaging and install the
          # desktop assets carried in the same flat release tarball.
          # The helper moved tools/ → scripts/ (2026-10): rewrite the
          # path inside any ALREADY-patched PKGBUILD, or the next bump
          # would still point at the old tarball layout and fail.
          sed -i 's#tools/install-desktop\.sh#scripts/install-desktop.sh#g' PKGBUILD
          if ! grep -q '^# shotori-desktop-assets$' PKGBUILD; then
            cat >> PKGBUILD <<'EOF'
          # shotori-desktop-assets
          eval "$(declare -f package | sed '1s/package/package_without_desktop/')"
          package() {
              package_without_desktop
              DESTDIR="$pkgdir" sh "$srcdir/scripts/install-desktop.sh" /usr
          }
          EOF
          fi
          # makepkg refuses to run as root (exit 10); printsrcinfo only
          # prints, but the guard fires regardless — run it as a mortal
          useradd -m builder
          install -d -o builder -g builder /home/builder/work
          cp PKGBUILD /home/builder/work/
          su builder -s /bin/bash -c "cd ~/work && makepkg --printsrcinfo" > .SRCINFO
          git add PKGBUILD .SRCINFO
          git commit -m "shotori ${GITHUB_REF_NAME#v}-1"
          git push

  crates-io:
    # Publishes to crates.io. Requires CARGO_REGISTRY_TOKEN (crates.io/settings/tokens,
    # publish-new + publish-update scopes) — a missing token FAILS the job:
    # a silent skip once shipped a "released" version that never reached
    # the registry.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `cargo publish` verifies the tarball by building it — the same
      # native deps the build job needs (gpui → fontconfig/xkbcommon)
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set — add it in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          cargo publish --token "$TOKEN"
